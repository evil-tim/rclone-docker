version: "3"

services:
  rclone:
    build:
      context: .
      network: host
    environment:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_DEFAULT_REGION
    volumes:
      # config
      - './config/rclone:/config/rclone'
      # cron
      - './crontab.txt:/etc/crontabs/internal'
      # data to sync
      - '/media/storage/_:/data/_'
      # timezone
      - '/etc/localtime:/etc/localtime:ro'
    cpus: 0.5
    mem_limit: 512m
    network_mode: host
    user: root
    security_opt:
      - 'no-new-privileges:true'

